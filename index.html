<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti ❤️</title>
<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(#ffd6e7,#fff5f8);
    text-align:center;
}
h1{
    color:#c2185b;
    margin-top:40px;
}
h2{
    color:#880e4f;
}
img{
    width:320px;
    max-width:90%;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
    margin-top:20px;
}
button{
    margin-top:30px;
    padding:15px 30px;
    font-size:22px;
    border:none;
    border-radius:30px;
    background:#e91e63;
    color:white;
    cursor:pointer;
}
#sorpresa{
    display:none;
    margin:30px;
    font-size:24px;
    color:#ad1457;
}
</style>
</head>
<body>

<h2>💌 Gracias por estos 2 hermosos meses a tu lado 💌</h2>
<img src="foto1.jpeg" alt="Nuestra foto">
<br>
<button onclick="document.getElementById('sorpresa').style.display='block'">
❤️ Ábreme ❤️
</button>
<div id="sorpresa">
❤️ Gracias por regalarme estos dos hermosos meses.
Quiero que esto sea solo el comienzo de una historia llena de sonrisas, alegrias y mucho amor. ❤️🧸
</div>

</html>
